name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "main.py"
      - "config.py"
      - "buildozer.spec"
      - "requirements-android.txt"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build AI-Analisis-Rambutan-Android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libtool-bin libltdl-dev pkg-config
          echo "ACLOCAL_PATH=/usr/share/aclocal" >> "$GITHUB_ENV"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.37

      - name: Cache Android build
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
          key: android-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements-android.txt') }}
          restore-keys: android-${{ runner.os }}-

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Analisis-Rambutan-Android
          path: bin/*.apk
          if-no-files-found: error
